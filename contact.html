<!DOCTYPE html>
<html>
<head>
  <title>SILQUE | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>SILQUE<span>WEAR</span></h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Collection</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>
<div class="information">
<section>
  <h2 class="section-title">Get in Touch</h2>

  <div class="contact-wrapper">

   <form>
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <input type="text" placeholder="Subject">

    <select>
      <option>General Inquiry</option>
      <option>Order Status</option>
      <option>Product Inquiry</option>
      <option>Feedback/Suggestions</option>
      <option>Other</option>
    </select>

    <textarea rows="4" placeholder="Message"></textarea>

  
    <p>Preferred Contact Method:</p>

   <div class="checkbox-group">
  
   <label>
    <input type="checkbox" name="contact" value="Email">
    Email
   </label>

   <label>
    <input type="checkbox" name="contact" value="Call">
    Call
   </label>

   <label>
     <input type="checkbox" name="contact" value="Text">
     Text
   </label>
   </div>

    <br><br>
    <button type="reset">Reset</button>
    <button type="submit">Submit</button>
   </form>
  </div>

  <div class="contact-info">
    <h3>Contact Information</h3>
    <p><strong>Email:</strong>contact@SILQUE.com</p>
    <p><strong>Phone:</strong>077 123 4567</p>
    <p><strong>Hours:</strong>Mon - Sat, 9:00 AM - 6:00 PM</p>
    <p>We aim to respond within 24 Hours</p>
  
  </div>

</section>
</div>

<footer>
  Email: contact@SILQUE.com | Phone: 077 123 4567
</footer>

</body>
</html>
